// ---------------------------------------------------------------------------
// Shared signing identity — openGym Wear OS pair.
//
// The watch app and the openGym phone fork must be signed with the SAME
// certificate, and use the SAME applicationId, or the Wearable Data Layer will
// not route between them. Play services matches on both.
//
// HOW TO USE (copy-paste, two steps)
//
//   1. Copy this file next to the project's `settings.gradle`, and copy
//      `keystore.properties` next to it as well (same directory).
//      Canonical sources, outside both repos:
//        F:\android\projects\opengym-wearos\keystore\keystore.gradle
//        F:\android\projects\opengym-wearos\keystore\keystore.properties
//
//   2. Add ONE line to the application module's build.gradle (Groovy DSL),
//      immediately after the plugin is applied and BEFORE the `android { }`
//      block:
//
//          apply from: rootProject.file('keystore.gradle')
//
//      Kotlin DSL equivalent:
//
//          apply(from = rootProject.file("keystore.gradle"))
//
// Nothing else is needed: this script creates a signing config named
// `opengym` and assigns it to both the `debug` and `release` build types.
//
// WHEN keystore.properties IS MISSING the script does nothing at all, so the
// module keeps AGP's default debug signing and the project still builds for
// anyone who does not have the shared key. This is deliberate — never make the
// shared keystore a hard build requirement.
//
// BENCH BUILD:
//   cd frontend/android && ./gradlew :app:signingReport
//   → SigningConfig "opengym" ... SHA-256: C6:0A:14:5C:6C:B2:89:AC:97:74:60:3C:5F:8F:C1:B9:B3:47:C6:61:8E:5B:3B:5B:2F:68:A1:13:11:79:28:13
// ---------------------------------------------------------------------------

def openGymKeystoreFile = rootProject.file('keystore.properties')

if (openGymKeystoreFile.exists()) {
    def openGymKeystore = new Properties()
    openGymKeystoreFile.withInputStream { openGymKeystore.load(it) }

    android {
        signingConfigs {
            opengym {
                storeFile file(openGymKeystore['storeFile'])
                storePassword openGymKeystore['storePassword']
                keyAlias openGymKeystore['keyAlias']
                keyPassword openGymKeystore['keyPassword']
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.opengym
            }
            release {
                signingConfig signingConfigs.opengym
            }
        }
    }

    logger.lifecycle("openGym: '${project.path}' is signed with the shared Wear OS keystore " +
            "(alias '${openGymKeystore['keyAlias']}', ${openGymKeystore['storeFile']})")
} else {
    logger.lifecycle("openGym: ${openGymKeystoreFile} not found — '${project.path}' keeps the " +
            'default Android debug signing key')
}
